<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urna Eletrônica 🌽</title>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root{
  --urna-body:#d8dce0;       /* cinza claro da urna real */
  --urna-bevel:#b0b4b8;      /* bevel/borda escura */
  --urna-dark:#888c90;       /* lateral/fundo escuro */
  --tela-bg:#e8f5e9;         /* fundo da tela (verde muito suave, como LCD apagado) */
  --tela-on:#001a0f;         /* fundo do display ligado */
  --verde:#00e676;
  --verde-dim:#00613a;
  --branco-btn:#f5f5f5;
  --laranja-btn:#e65100;
  --verde-btn:#1b5e20;
  --tecla-bg:#1a1a1a;
  --tecla-top:#2e2e2e;
  --fonte:  'Courier New', Courier, monospace;
  --fonte-ui: system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background: linear-gradient(160deg,#c8cdd2 0%,#adb2b7 100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:20px 12px 40px;
  font-family:var(--fonte);
}

/* ── BANNER SUPERIOR (fora da urna) ─── */
#banner-top{
  width:100%;max-width:860px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
  padding:0 4px;
  gap:8px;
  flex-wrap:wrap;
}
#banner-top .evento{
  font-family:var(--fonte-ui);
  font-size:1rem;font-weight:700;
  color:#2a2a3a;
  letter-spacing:0.02em;
}
#banner-top .evento span{ color:#d97800; }
.btns-admin{ display:flex; gap:6px; flex-shrink:0; }
.btn-admin{
  padding:7px 16px;
  font-family:var(--fonte);
  font-size:0.72rem;
  font-weight:bold;
  border:none;border-radius:6px;
  cursor:pointer;
  letter-spacing:0.06em;
  text-transform:uppercase;
  transition:filter 0.15s,transform 0.1s;
}
.btn-admin:active{transform:scale(0.96);}
#btn-iniciar{background:#1a6e1a;color:#fff;box-shadow:0 2px 8px #0004;}
#btn-iniciar:hover{filter:brightness(1.15);}
#btn-finalizar{background:#8b0000;color:#fff;box-shadow:0 2px 8px #0004;}
#btn-finalizar:hover{filter:brightness(1.2);}

/* ── CORPO DA URNA ───────────────────────────────────────── */
#urna{
  width:100%;max-width:860px;
  background:var(--urna-body);
  border-radius:14px 14px 10px 10px;
  box-shadow:
    0 2px 0 #fff inset,        /* bevel claro superior */
    0 -2px 0 var(--urna-bevel) inset,
    4px 0 0 #fff inset,
    -4px 0 0 var(--urna-bevel) inset,
    0 12px 40px #0006,
    0 2px 6px #0003;
  overflow:hidden;
}

/* cabeçalho da urna */
#cab-urna{
  background:#e8eaec;
  border-bottom:3px solid var(--urna-bevel);
  padding:8px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo-je{
  display:flex;align-items:center;gap:10px;
}
.brasao-svg{ width:40px;height:40px;flex-shrink:0; }
.je-texto{ font-family:var(--fonte-ui); }
.je-texto .linha1{ font-size:0.65rem;color:#555;letter-spacing:0.08em;text-transform:uppercase; }
.je-texto .linha2{ font-size:1rem;font-weight:800;color:#1a1a3a;letter-spacing:0.04em; }
.urna-serial{ font-size:0.6rem;color:#999;text-align:right;line-height:1.7; }

/* layout tela + teclado */
#corpo-urna{
  display:grid;
  grid-template-columns: 1fr auto;
  gap:0;
}

/* ── TELA ────────────────────────────────────────────────── */
#painel-tela{
  background:#c0c4c8;
  padding:16px;
  border-right:3px solid var(--urna-bevel);
  display:flex;
  flex-direction:column;
  gap:10px;
}
#display{
  background:var(--tela-on);
  border-radius:6px;
  border:4px solid #111;
  box-shadow:0 0 0 2px #555 inset, 0 4px 20px #0008;
  min-height:220px;
  padding:14px;
  position:relative;
  overflow:hidden;
  flex:1;
}
#display::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,#00150a18 3px,#00150a18 4px);
  pointer-events:none;z-index:0;
}
#display-conteudo{ position:relative;z-index:1; }

/* barra de cargo abaixo da tela */
#barra-cargo{
  display:none;
  flex-wrap:wrap;
  gap:5px;
}
.btn-cargo{
  font-family:var(--fonte);
  font-size:0.62rem;
  padding:4px 12px;
  border-radius:20px;
  border:2px solid #999;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:0.06em;
  background:#c0c4c8;
  color:#444;
  transition:all 0.2s;
}
.btn-cargo.ativo{background:#1a1a3a;color:#fff;border-color:#1a1a3a;}
.btn-cargo:hover:not(.ativo){background:#a0a4a8;}

/* ── DISPLAY CONTEÚDO ──────── */
.disp-cargo{
  font-size:0.65rem;color:#00c853;
  letter-spacing:0.12em;text-transform:uppercase;
  border-bottom:1px solid var(--verde-dim);
  padding-bottom:6px;margin-bottom:10px;
}
.disp-numero{
  font-size:2.6rem;color:var(--verde);
  letter-spacing:0.2em;
  text-shadow:0 0 10px #00e67699;
  display:flex;align-items:center;gap:6px;
  min-height:3.2rem;
}
.slot{
  width:1.5ch;border-bottom:3px solid var(--verde-dim);
  text-align:center;display:inline-block;
}
.slot.ativo{border-color:var(--verde);animation:pisca 0.8s infinite;}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:0}}

.disp-candidato{
  display:flex;gap:12px;margin-top:12px;min-height:95px;
}
.foto-box{
  width:72px;height:95px;
  border:2px solid var(--verde-dim);
  background:#002010;border-radius:4px;
  overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.foto-box img{width:100%;height:100%;object-fit:cover;}
.foto-icon{font-size:2.2rem;color:#00401f;}

.info-cand{ flex:1; }
.campo-label{font-size:0.58rem;color:#00c853;text-transform:uppercase;letter-spacing:0.1em;}
.campo-valor{font-size:0.9rem;color:var(--verde);margin-bottom:6px;
  text-shadow:0 0 6px #00e67644;line-height:1.2;}
.campo-valor.big{font-size:1rem;}

.disp-msg{
  color:var(--verde);font-size:0.95rem;
  text-align:center;padding:24px 0;
  text-shadow:0 0 10px #00e676aa;line-height:1.7;
}
.disp-msg.erro{color:#ff5252;text-shadow:0 0 10px #ff525288;}
.disp-msg.aviso{color:#ffd600;text-shadow:0 0 10px #ffd60088;}

/* ── TECLADO (coluna direita) ─────────────────────────────── */
#painel-teclado{
  background:#b8bcbf;
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  min-width:200px;
}
/* label "JUSTIÇA ELEITORAL" no teclado (como na foto) */
.teclado-header{
  background:#e8eaec;
  border:1px solid #aaa;
  border-radius:4px;
  padding:4px 10px;
  font-family:var(--fonte-ui);
  font-size:0.62rem;
  font-weight:700;
  color:#1a1a3a;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-align:center;
  width:100%;
  margin-bottom:4px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.grid-num{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  width:100%;
}
.tecla{
  background:linear-gradient(160deg,var(--tecla-top),var(--tecla-bg));
  border:1px solid #111;
  border-bottom:4px solid #000;
  border-radius:5px;
  color:#e0e0e0;
  font-family:var(--fonte);
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
  height:50px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.07s;
  user-select:none;-webkit-tap-highlight-color:transparent;
  letter-spacing:0.05em;
}
.tecla:active,.tecla.press{
  border-bottom:1px solid #000;
  transform:translateY(3px);
  background:linear-gradient(160deg,var(--tecla-bg),var(--tecla-top));
}
.tecla-zero{grid-column:2;} /* 0 fica centralizado */

/* botões de ação (BRANCO / CORRIGE / CONFIRMA) */
.linha-acao{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:5px;width:100%;margin-top:4px;
}
.tecla-acao{
  border:none;border-radius:5px;
  font-family:var(--fonte);font-size:0.55rem;font-weight:bold;
  letter-spacing:0.04em;text-transform:uppercase;
  height:44px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-bottom:4px solid rgba(0,0,0,0.3);
  transition:all 0.07s;user-select:none;
}
.tecla-acao:active{border-bottom:1px solid rgba(0,0,0,0.3);transform:translateY(3px);}
.t-branco{background:var(--branco-btn);color:#333;}
.t-corrige{background:var(--laranja-btn);color:#fff;}
.t-confirma{background:var(--verde-btn);color:#fff;}

/* ── MODAIS ──────────────────────────────────────────────── */
.overlay{
  display:none;position:fixed;inset:0;
  background:#0009;z-index:200;
  align-items:center;justify-content:center;padding:16px;
}
.overlay.aberto{display:flex;}
.modal{
  background:#f0f2f4;
  border-radius:10px;border:2px solid #bbb;
  padding:24px;
  width:100%;max-width:460px;
  max-height:90vh;overflow-y:auto;
  font-family:var(--fonte-ui);
}
.modal h2{
  font-size:0.95rem;font-weight:800;color:#1a1a3a;
  margin-bottom:14px;letter-spacing:0.04em;text-transform:uppercase;
  border-bottom:2px solid #dde;padding-bottom:8px;
}
.modal label{font-size:0.72rem;color:#555;display:block;margin-top:10px;margin-bottom:3px;}
.modal input[type=text],.modal input[type=password],.modal input[type=number]{
  width:100%;padding:8px 10px;
  background:#fff;border:1.5px solid #bbb;border-radius:5px;
  font-family:var(--fonte);font-size:0.88rem;color:#1a1a3a;
  outline:none;transition:border-color 0.2s;
}
.modal input:focus{border-color:#1a6e1a;}
.linha-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.bm{
  padding:8px 18px;font-family:var(--fonte);
  font-size:0.72rem;border-radius:5px;border:none;
  cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;font-weight:bold;
  transition:filter 0.15s;
}
.bm:hover{filter:brightness(1.1);}
.bm-ok{background:#1a6e1a;color:#fff;}
.bm-cancel{background:#bbb;color:#333;}

/* config candidato */
.cand-card{
  border:1.5px solid #ccc;border-radius:6px;
  padding:10px;background:#fff;margin-top:8px;
}
.cand-card h4{font-size:0.72rem;color:#1a6e1a;margin-bottom:6px;text-transform:uppercase;}
.foto-label{
  display:inline-block;padding:5px 10px;
  background:#1a3a6e;color:#fff;
  border-radius:4px;cursor:pointer;
  font-size:0.62rem;font-family:var(--fonte);
  text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;
}
.foto-label:hover{background:#2a5ab8;}
input[type=file]{display:none;}
.prev-foto{width:48px;height:62px;object-fit:cover;border-radius:3px;border:1px solid #ccc;margin-left:6px;vertical-align:middle;}

/* boletim */
.bu-title{text-align:center;font-size:0.92rem;font-weight:800;color:#1a1a3a;letter-spacing:0.06em;margin-bottom:4px;}
.bu-sub{text-align:center;color:#888;font-size:0.65rem;margin-bottom:12px;}
.bu-linha{
  display:flex;justify-content:space-between;
  padding:4px 0;border-bottom:1px dashed #ddd;
  font-size:0.72rem;color:#333;font-family:var(--fonte);
}
.bu-linha.ok{color:#1a6e1a;font-weight:bold;}
.bu-linha.win{color:#d97800;font-weight:bold;}
.bu-secao{margin-top:10px;margin-bottom:3px;font-size:0.6rem;color:#aaa;text-transform:uppercase;letter-spacing:0.1em;}
.barra{height:6px;background:#eee;border-radius:3px;margin-top:2px;margin-bottom:6px;overflow:hidden;}
.barra-fill{height:100%;border-radius:3px;transition:width 1s;}
.fill-verde{background:#1a6e1a;}
.fill-amarelo{background:#d97800;}
.fill-vermelho{background:#b71c1c;}
.bu-hash{margin-top:10px;font-size:0.52rem;color:#bbb;word-break:break-all;text-align:center;border-top:1px solid #ddd;padding-top:8px;}
.win-box{
  background:#fff8e1;border:2px solid #d97800;
  border-radius:6px;padding:8px 12px;margin:6px 0;text-align:center;
}
.win-box .wn{font-size:0.88rem;font-weight:800;color:#d97800;}
.win-box .wv{font-size:0.65rem;color:#888;margin-top:2px;}

/* voto confirmado flash */
#flash-voto{
  display:none;position:fixed;inset:0;
  background:#000c;z-index:300;
  align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
}
#flash-voto.show{display:flex;}
#flash-voto .ico{font-size:4rem;}
#flash-voto .msg{font-size:1.2rem;color:#00e676;font-family:var(--fonte);
  text-shadow:0 0 12px #00e676aa;}

/* rodapé das ranhuras (estética) */
#rodape-urna{
  background:#a8acb0;
  border-top:2px solid var(--urna-bevel);
  height:28px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 20px;
}
.ranhura{
  width:30px;height:6px;
  background:#888;border-radius:3px;
  box-shadow:0 1px 0 #fff inset;
}

/* ── RESPONSIVO ──── */
@media(max-width:600px){
  #corpo-urna{grid-template-columns:1fr;grid-template-rows:auto auto;}
  #painel-teclado{border-top:3px solid var(--urna-bevel);min-width:unset;}
  .grid-num{max-width:220px;margin:0 auto;}
  .linha-acao{max-width:220px;margin:0 auto;}
  .tecla-zero{grid-column:2;}
}
</style>
</head>
<body>

<!-- BANNER -->
<div id="banner-top">
  <div class="evento">🌽 <span>Votação da Festa Junina</span> — Sistema de Urna Eletrônica</div>
  <div class="btns-admin">
    <button class="btn-admin" id="btn-iniciar">▶ Iniciar</button>
    <button class="btn-admin" id="btn-finalizar">■ Finalizar</button>
  </div>
</div>

<!-- CORPO DA URNA -->
<div id="urna">
  <!-- cabeçalho -->
  <div id="cab-urna">
    <div class="logo-je">
      <!-- brasão SVG simplificado -->
      <svg class="brasao-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="40" cy="40" r="38" fill="#1a3a6e" stroke="#d4af37" stroke-width="3"/>
        <polygon points="40,12 47,33 70,33 52,46 59,67 40,54 21,67 28,46 10,33 33,33" fill="#d4af37"/>
        <circle cx="40" cy="40" r="10" fill="#1a3a6e" stroke="#d4af37" stroke-width="1.5"/>
        <text x="40" y="44" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" font-family="serif">BR</text>
      </svg>
      <div class="je-texto">
        <div class="linha1">República Federativa do Brasil</div>
        <div class="linha2">JUSTIÇA ELEITORAL</div>
      </div>
    </div>
    <div class="urna-serial">
      SN: <span id="serial-num">--------</span><br>
      <span id="data-urna">--/--/----</span>
    </div>
  </div>

  <!-- grade tela + teclado -->
  <div id="corpo-urna">

    <!-- PAINEL ESQUERDO: TELA -->
    <div id="painel-tela">
      <div id="display">
        <div id="display-conteudo">
          <!-- renderizado por JS -->
        </div>
      </div>
      <div id="barra-cargo">
        <!-- cargos renderizados por JS -->
      </div>
    </div>

    <!-- PAINEL DIREITO: TECLADO -->
    <div id="painel-teclado">
      <div class="teclado-header">
        <svg width="18" height="18" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="#1a3a6e"/><polygon points="40,12 47,33 70,33 52,46 59,67 40,54 21,67 28,46 10,33 33,33" fill="#d4af37"/></svg>
        JUSTIÇA ELEITORAL
      </div>
      <div class="grid-num">
        <button class="tecla" data-n="1">1</button>
        <button class="tecla" data-n="2">2</button>
        <button class="tecla" data-n="3">3</button>
        <button class="tecla" data-n="4">4</button>
        <button class="tecla" data-n="5">5</button>
        <button class="tecla" data-n="6">6</button>
        <button class="tecla" data-n="7">7</button>
        <button class="tecla" data-n="8">8</button>
        <button class="tecla" data-n="9">9</button>
        <!-- 0 centralizado -->
        <div></div>
        <button class="tecla tecla-zero" data-n="0">0</button>
        <div></div>
      </div>
      <div class="linha-acao">
        <button class="tecla-acao t-branco" id="btn-branco">BRANCO</button>
        <button class="tecla-acao t-corrige" id="btn-corrige">CORRIGE</button>
        <button class="tecla-acao t-confirma" id="btn-confirma">CONFIRMA</button>
      </div>
    </div>

  </div><!-- /corpo-urna -->

  <!-- rodapé estética (ranhuras) -->
  <div id="rodape-urna">
    <div class="ranhura"></div><div class="ranhura"></div><div class="ranhura"></div>
    <div class="ranhura"></div><div class="ranhura"></div><div class="ranhura"></div>
    <div class="ranhura"></div><div class="ranhura"></div>
  </div>
</div><!-- /urna -->

<!-- flash voto confirmado -->
<div id="flash-voto">
  <div class="ico">✅</div>
  <div class="msg">VOTO COMPUTADO</div>
</div>

<!-- ===== MODAL INICIAR ===== -->
<div class="overlay" id="ov-iniciar">
<div class="modal">
  <h2>▶ Iniciar Votação</h2>
  <label>Senha do Administrador</label>
  <input type="password" id="inp-senha-ini" placeholder="••••••">
  <label>Nome do Evento (aparece no topo)</label>
  <input type="text" id="inp-titulo" value="Rei e Rainha do Milho 2025">
  <label>Quantidade de dígitos por número (2 a 5)</label>
  <input type="number" id="inp-digitos" value="2" min="2" max="5">
  <hr style="margin-top:14px;border-color:#dde">
  <div id="cargos-form"></div>
  <button class="bm bm-ok" id="btn-add-cargo" style="width:100%;margin-top:10px">+ Adicionar Cargo</button>
  <div class="linha-btns">
    <button class="bm bm-cancel" id="btn-cancel-ini">Cancelar</button>
    <button class="bm bm-ok" id="btn-ok-ini">✓ Iniciar</button>
  </div>
  <div id="err-ini" style="color:#b71c1c;font-size:0.7rem;margin-top:6px;display:none"></div>
</div>
</div>

<!-- ===== MODAL FINALIZAR ===== -->
<div class="overlay" id="ov-finalizar">
<div class="modal">
  <h2>■ Encerrar Votação</h2>
  <label>Senha do Administrador</label>
  <input type="password" id="inp-senha-fin" placeholder="••••••">
  <div class="linha-btns">
    <button class="bm bm-cancel" id="btn-cancel-fin">Cancelar</button>
    <button class="bm bm-ok" id="btn-ok-fin">Encerrar e Ver Resultado</button>
  </div>
  <div id="err-fin" style="color:#b71c1c;font-size:0.7rem;margin-top:6px;display:none"></div>
</div>
</div>

<!-- ===== MODAL BOLETIM ===== -->
<div class="overlay" id="ov-boletim">
<div class="modal" style="max-width:480px">
  <div id="bu-content"></div>
  <div class="linha-btns">
    <button class="bm bm-cancel" id="btn-fechar-bu">Fechar</button>
    <button class="bm bm-ok" onclick="window.print()">🖨 Imprimir</button>
  </div>
</div>
</div>

<script>
// ============================================================
// ESTADO
// ============================================================
const SENHA = "131313";

let S = {
  ativo: false,
  titulo: "",
  digitos: 2,
  cargos: [],
  cargoIdx: 0,
  entrados: [],     // dígitos digitados no momento
  votos: [],        // [{ci, num}] – embaralhado a cada voto
  totalVotos: 0,
  dataInicio: "",
  hashUrna: "",
};

let cfgCargos = [];

// ============================================================
// UTILITÁRIOS
// ============================================================
const $ = id => document.getElementById(id);
const rand16 = () => Math.floor(Math.random()*0xFFFF).toString(16).toUpperCase().padStart(4,'0');
const serial = () => Array.from({length:2},rand16).join('-');
const hoje = () => new Date().toLocaleDateString("pt-BR");
const agora = () => new Date().toLocaleString("pt-BR");

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function hashSimples(obj){
  const s = JSON.stringify(obj)+Date.now();
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i)|0;
  return Math.abs(h).toString(16).toUpperCase().padStart(8,'0')+'-'+rand16();
}

// ============================================================
// DISPLAY
// ============================================================
function renderDisplay(){
  const el = $("display-conteudo");
  const bc = $("barra-cargo");

  if(!S.ativo){
    el.innerHTML = `<div class="disp-msg aviso">
      ── AGUARDANDO INÍCIO ──<br><br>
      Clique em <strong>INICIAR</strong><br>para abrir a votação.
    </div>`;
    bc.style.display = "none";
    return;
  }

  const cargo = S.cargos[S.cargoIdx];
  const digitos = S.digitos;
  const ent = S.entrados;

  // slots de dígitos
  let slots = "";
  for(let i=0;i<digitos;i++){
    const ch = ent[i]!==undefined ? ent[i] : "";
    const at = i===ent.length ? "ativo" : "";
    slots += `<span class="slot ${at}">${ch}</span>`;
  }

  // candidato (se número completo)
  let candHtml = "";
  if(ent.length===digitos){
    const num = ent.join("");
    const cand = cargo.candidatos.find(c=>c.num===num);
    if(cand){
      candHtml = `
        <div class="disp-candidato">
          <div class="foto-box">
            ${cand.fotoTit ? `<img src="${cand.fotoTit}" alt="titular">` : `<span class="foto-icon">👤</span>`}
          </div>
          <div class="info-cand">
            <div class="campo-label">Nome</div>
            <div class="campo-valor big">${cand.nome||'—'}</div>
            <div class="campo-label">Vice / Chapa</div>
            <div class="campo-valor">${cand.vice||'—'}</div>
            <div class="campo-label">Partido / Grupo</div>
            <div class="campo-valor">${cand.partido||'—'}</div>
          </div>
          ${cand.fotoVice?`<div class="foto-box"><img src="${cand.fotoVice}" alt="vice"></div>`:''}
        </div>`;
    } else {
      candHtml = `<div class="disp-msg erro">NÚMERO INVÁLIDO<br><small>Pressione CORRIGE</small></div>`;
    }
  }

  el.innerHTML = `
    <div class="disp-cargo">${cargo.nome}</div>
    <div class="disp-numero">${slots}</div>
    ${candHtml}
  `;

  // barra de cargos
  bc.style.display = "flex";
  bc.innerHTML = S.cargos.map((c,i)=>
    `<button class="btn-cargo ${i===S.cargoIdx?'ativo':''}" onclick="irCargo(${i})">${c.nome}</button>`
  ).join("");
}

function irCargo(i){ S.cargoIdx=i; S.entrados=[]; renderDisplay(); }

function flashMsg(msg, tipo="aviso"){
  $("display-conteudo").innerHTML=`<div class="disp-msg ${tipo}">${msg}</div>`;
  setTimeout(renderDisplay,1800);
}

// ============================================================
// TECLADO
// ============================================================
function pressNum(n){
  if(!S.ativo) return;
  if(S.entrados.length>=S.digitos) return;
  S.entrados.push(String(n));
  renderDisplay();
}

function pressCorrige(){ if(!S.ativo)return; S.entrados=[]; renderDisplay(); }

function pressConfirma(){
  if(!S.ativo) return;
  if(S.entrados.length<S.digitos){ flashMsg("NÚMERO INCOMPLETO","erro"); return; }
  const num = S.entrados.join("");
  const cargo = S.cargos[S.cargoIdx];
  const cand = cargo.candidatos.find(c=>c.num===num);
  if(!cand){ flashMsg("NÚMERO INVÁLIDO — pressione CORRIGE","erro"); return; }
  registrarVoto(S.cargoIdx, num);
}

function pressBranco(){ if(!S.ativo)return; registrarVoto(S.cargoIdx,"BRANCO"); }

function registrarVoto(ci, num){
  S.votos.push({ci, num, ts: Date.now()});
  // embaralha só os votos deste cargo (anonimização)
  const deste = shuffle(S.votos.filter(v=>v.ci===ci));
  const outros = S.votos.filter(v=>v.ci!==ci);
  S.votos = [...outros, ...deste];
  S.totalVotos++;
  S.entrados = [];
  // avança cargo
  S.cargoIdx = (S.cargoIdx+1) % S.cargos.length;

  // flash confirmação
  const f = $("flash-voto");
  f.classList.add("show");
  setTimeout(()=>{ f.classList.remove("show"); renderDisplay(); }, 1300);
}

// eventos teclado HTML
document.querySelectorAll(".tecla[data-n]").forEach(b=>{
  b.addEventListener("click",()=>{
    b.classList.add("press");
    setTimeout(()=>b.classList.remove("press"),130);
    pressNum(b.dataset.n);
  });
});
$("btn-corrige").addEventListener("click", pressCorrige);
$("btn-confirma").addEventListener("click", pressConfirma);
$("btn-branco").addEventListener("click", pressBranco);

// teclado físico
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  // teclado principal (linha de cima) e teclado numérico lateral
  if((e.key>="0"&&e.key<="9") || (e.code>="Numpad0"&&e.code<="Numpad9"))
    pressNum(e.key==="."? null : (e.code.startsWith("Numpad") ? e.code.replace("Numpad","") : e.key));
  if(e.key==="Enter"||e.code==="NumpadEnter") pressConfirma();
  if(e.key==="Backspace"||e.code==="NumpadDecimal") pressCorrige();
  if(e.key==="b"||e.key==="B") pressBranco();
});

// ============================================================
// MODAL INICIAR
// ============================================================
$("btn-iniciar").addEventListener("click",()=>{
  if(S.ativo){ alert("Votação já está em andamento.\nFinalize antes de reiniciar."); return; }
  cfgCargos = [
    { nome:"REI DO MILHO", candidatos:[
      {num:"01",nome:"",vice:"",partido:"",fotoTit:"",fotoVice:""},
      {num:"02",nome:"",vice:"",partido:"",fotoTit:"",fotoVice:""},
    ]},
    { nome:"RAINHA DO MILHO", candidatos:[
      {num:"01",nome:"",vice:"",partido:"",fotoTit:"",fotoVice:""},
      {num:"02",nome:"",vice:"",partido:"",fotoTit:"",fotoVice:""},
    ]},
  ];
  renderCargosForm();
  $("ov-iniciar").classList.add("aberto");
});

$("btn-cancel-ini").addEventListener("click",()=>$("ov-iniciar").classList.remove("aberto"));

$("btn-add-cargo").addEventListener("click",()=>{
  const n = cfgCargos.length+1;
  cfgCargos.push({nome:`CARGO ${n}`,candidatos:[{num:"01",nome:"",vice:"",partido:"",fotoTit:"",fotoVice:""}]});
  renderCargosForm();
});

function renderCargosForm(){
  $("cargos-form").innerHTML = cfgCargos.map((cargo,ci)=>`
    <div style="border:1.5px solid #ccc;border-radius:7px;padding:12px;background:#fff;margin-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong style="font-size:0.78rem;color:#1a3a6e">📋 CARGO ${ci+1}</strong>
        <button class="bm bm-cancel" style="padding:3px 8px;font-size:0.6rem"
          onclick="remCargo(${ci})">Remover</button>
      </div>
      <label>Nome do Cargo</label>
      <input type="text" value="${cargo.nome}" oninput="cfgCargos[${ci}].nome=this.value">
      ${cargo.candidatos.map((cand,ki)=>renderCandForm(ci,ki,cand)).join("")}
      <button class="bm bm-ok" style="width:100%;margin-top:8px;padding:5px;font-size:0.65rem"
        onclick="addCand(${ci})">+ Candidato</button>
    </div>
  `).join("");
}

function renderCandForm(ci,ki,cand){
  const fTId=`ft-${ci}-${ki}`, fVId=`fv-${ci}-${ki}`;
  return `
    <div style="border:1px solid #dde;border-radius:5px;padding:8px;margin-top:7px;background:#f8f9ff">
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:0.68rem;color:#1a6e1a;font-weight:bold">Candidato ${ki+1}</span>
        <button class="bm bm-cancel" style="padding:2px 7px;font-size:0.58rem"
          onclick="remCand(${ci},${ki})">✕</button>
      </div>
      <label>Número (${S.digitos} dígitos)</label>
      <input type="text" value="${cand.num}" maxlength="${S.digitos}"
        oninput="cfgCargos[${ci}].candidatos[${ki}].num=this.value.padStart(${S.digitos},'0')" placeholder="${'0'.repeat(S.digitos)}">
      <label>Nome</label>
      <input type="text" value="${cand.nome}" oninput="cfgCargos[${ci}].candidatos[${ki}].nome=this.value">
      <label>Vice / Nome da Chapa</label>
      <input type="text" value="${cand.vice}" oninput="cfgCargos[${ci}].candidatos[${ki}].vice=this.value">
      <label>Partido / Grupo</label>
      <input type="text" value="${cand.partido}" oninput="cfgCargos[${ci}].candidatos[${ki}].partido=this.value">
      <div style="margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label class="foto-label" for="${fTId}">📷 Foto Titular</label>
        <input type="file" id="${fTId}" accept="image/*" onchange="loadFoto(this,${ci},${ki},'fotoTit')">
        ${cand.fotoTit?`<img src="${cand.fotoTit}" class="prev-foto">`:''}
      </div>
      <div style="margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label class="foto-label" for="${fVId}">📷 Foto Vice</label>
        <input type="file" id="${fVId}" accept="image/*" onchange="loadFoto(this,${ci},${ki},'fotoVice')">
        ${cand.fotoVice?`<img src="${cand.fotoVice}" class="prev-foto">`:''}
      </div>
    </div>`;
}

function loadFoto(inp,ci,ki,campo){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ cfgCargos[ci].candidatos[ki][campo]=e.target.result; renderCargosForm(); };
  r.readAsDataURL(f);
}

function addCand(ci){
  const total=cfgCargos[ci].candidatos.length+1;
  cfgCargos[ci].candidatos.push({num:String(total).padStart(S.digitos,'0'),nome:"",vice:"",partido:"",fotoTit:"",fotoVice:""});
  renderCargosForm();
}
function remCand(ci,ki){
  if(cfgCargos[ci].candidatos.length<=1){alert("Mínimo 1 candidato.");return;}
  cfgCargos[ci].candidatos.splice(ki,1); renderCargosForm();
}
function remCargo(ci){
  if(cfgCargos.length<=1){alert("Mínimo 1 cargo.");return;}
  cfgCargos.splice(ci,1); renderCargosForm();
}

$("btn-ok-ini").addEventListener("click",()=>{
  const err = $("err-ini");
  if($("inp-senha-ini").value !== SENHA){
    err.textContent="Senha incorreta."; err.style.display="block"; return;
  }
  err.style.display="none";
  S.digitos = parseInt($("inp-digitos").value)||2;
  S.titulo = $("inp-titulo").value.trim()||"Votação";
  S.cargos = JSON.parse(JSON.stringify(cfgCargos));
  S.cargoIdx = 0; S.entrados = []; S.votos = []; S.totalVotos = 0;
  S.ativo = true;
  S.dataInicio = agora();
  S.hashUrna = hashSimples({titulo:S.titulo, digitos:S.digitos, ts:Date.now()});
  $("serial-num").textContent = serial();
  $("data-urna").textContent = hoje();
  $("banner-top").querySelector(".evento span").textContent = S.titulo;
  $("ov-iniciar").classList.remove("aberto");
  $("inp-senha-ini").value="";
  exibirBU("zeresima");
  renderDisplay();
});

// MODAL FINALIZAR
// ============================================================
$("btn-finalizar").addEventListener("click",()=>$("ov-finalizar").classList.add("aberto"));
$("btn-cancel-fin").addEventListener("click",()=>$("ov-finalizar").classList.remove("aberto"));
$("btn-ok-fin").addEventListener("click",()=>{
  const err=$("err-fin");
  if($("inp-senha-fin").value!==SENHA){
    err.textContent="Senha incorreta."; err.style.display="block"; return;
  }
  err.style.display="none";
  $("inp-senha-fin").value="";
  $("ov-finalizar").classList.remove("aberto");
  S.ativo=false;
  exibirBU("resultado");
  renderDisplay();
});

$("btn-fechar-bu").addEventListener("click",()=>$("ov-boletim").classList.remove("aberto"));

// ============================================================
// BOLETIM DE URNA
// ============================================================
function exibirBU(tipo){
  const now = agora();
  let html = "";

  if(tipo==="zeresima"){
    html = `
      <div class="bu-title">BOLETIM DE URNA — ZERÉSIMA</div>
      <div class="bu-sub">${S.titulo} · ${now}</div>
      <div class="bu-linha"><span>Serial da Urna</span><span>${$("serial-num").textContent}</span></div>
      <div class="bu-linha"><span>Início da Sessão</span><span>${S.dataInicio}</span></div>
      <div class="bu-linha ok"><span>Total de Votos</span><span>0 (ZERO)</span></div>
    `;
    S.cargos.forEach(c=>{
      html+=`<div class="bu-secao">── ${c.nome} ──</div>`;
      c.candidatos.forEach(cand=>{
        html+=`<div class="bu-linha"><span>Nº ${cand.num} · ${cand.nome||'—'}</span><span>0 votos</span></div>`;
      });
      html+=`<div class="bu-linha"><span>Branco</span><span>0</span></div>`;
      html+=`<div class="bu-linha"><span>Nulo</span><span>0</span></div>`;
    });
    html+=`<div class="bu-hash">ZERÉSIMA · HASH: ${S.hashUrna} · ${now}</div>`;

  } else {
    html = `
      <div class="bu-title">BOLETIM DE URNA — RESULTADO FINAL</div>
      <div class="bu-sub">${S.titulo} · Encerramento: ${now}</div>
      <div class="bu-linha"><span>Serial da Urna</span><span>${$("serial-num").textContent}</span></div>
      <div class="bu-linha"><span>Total de Votantes</span><span>${S.totalVotos}</span></div>
    `;

    S.cargos.forEach((cargo,ci)=>{
      const vCargo = S.votos.filter(v=>v.ci===ci);
      const total = vCargo.length;
      const brancos = vCargo.filter(v=>v.num==="BRANCO").length;
      const validos = total - brancos;

      // contagem
      const cont = {};
      cargo.candidatos.forEach(c=>cont[c.num]=0);
      vCargo.filter(v=>v.num!=="BRANCO").forEach(v=>{ if(cont[v.num]!==undefined) cont[v.num]++; });

      // vencedor
      let winNum=null, winQt=-1;
      Object.entries(cont).forEach(([n,q])=>{ if(q>winQt){winQt=q;winNum=n;} });

      html+=`<div class="bu-secao">── ${cargo.nome} · ${total} voto(s) ──</div>`;

      cargo.candidatos.forEach(cand=>{
        const qt = cont[cand.num]||0;
        const pct = validos>0 ? ((qt/validos)*100).toFixed(1) : "0.0";
        const win = winNum===cand.num && qt>0;
        const fillCls = win ? "fill-amarelo" : "fill-verde";
        html+=`
          <div class="bu-linha ${win?'win':''}">
            <span>Nº ${cand.num} · ${cand.nome||'—'}${win?' 🏆':''}</span>
            <span>${qt} votos · ${pct}% válidos</span>
          </div>
          <div class="barra"><div class="barra-fill ${fillCls}" style="width:0" data-w="${pct}%"></div></div>`;
      });

      html+=`
        <div class="bu-linha"><span>Votos Brancos</span>
          <span>${brancos} · ${total>0?((brancos/total)*100).toFixed(1):'0.0'}%</span></div>
        <div class="barra"><div class="barra-fill fill-vermelho" style="width:0"
          data-w="${total>0?(brancos/total*100).toFixed(1)+'%':'0%'}"></div></div>
        <div class="bu-linha"><span>Votos Nulos</span><span>0</span></div>
        <div class="bu-linha ok"><span>Votos Válidos</span><span>${validos} de ${total}</span></div>
      `;

      // destaque vencedor
      if(winQt>0){
        const wc=cargo.candidatos.find(c=>c.num===winNum);
        html+=`<div class="win-box">
          <div class="wn">🏆 VENCEDOR — ${wc?.nome||winNum}</div>
          ${wc?.vice?`<div class="wv">Vice/Chapa: ${wc.vice}</div>`:''}
        </div>`;
      } else {
        html+=`<div style="text-align:center;color:#aaa;font-size:0.7rem;margin:4px 0">— Nenhum voto registrado —</div>`;
      }
    });

    html+=`<div class="bu-hash">RESULTADO FINAL · HASH: ${S.hashUrna} · ${now}</div>`;
  }

  $("bu-content").innerHTML = html;
  $("ov-boletim").classList.add("aberto");

  // anima barras
  setTimeout(()=>{
    document.querySelectorAll(".barra-fill[data-w]").forEach(b=>{
      b.style.width = b.dataset.w;
    });
  },120);
}

// ============================================================
// INIT
// ============================================================
$("serial-num").textContent = serial();
$("data-urna").textContent = hoje();
renderDisplay();
</script>
